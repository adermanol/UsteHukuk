name: Radar IP Test (geçici)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Sertifikaları güncelle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ca-certificates && sudo update-ca-certificates

      - name: Resmî Gazete
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "-- normal (sertifika doğrulamalı) --"
          curl -s -o /dev/null -w "resmigazete.gov.tr -> %{http_code} (exit=%{exitcode})\n" -A "$UA" "https://www.resmigazete.gov.tr/" || echo "exit code: $?"
          echo "-- -k (sertifika doğrulamasız, sadece teşhis) --"
          curl -sk -o /dev/null -w "resmigazete.gov.tr -k -> %{http_code}\n" -A "$UA" "https://www.resmigazete.gov.tr/" || echo "exit code: $?"

      - name: Mevzuat Bilgi Sistemi
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "-- normal --"
          curl -s -o /dev/null -w "mevzuat.gov.tr -> %{http_code}\n" -A "$UA" "https://www.mevzuat.gov.tr/" || echo "exit code: $?"
          echo "-- -k --"
          curl -sk -o /dev/null -w "mevzuat.gov.tr -k -> %{http_code}\n" -A "$UA" "https://www.mevzuat.gov.tr/" || echo "exit code: $?"

      - name: Rekabet Kurumu
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "-- normal --"
          curl -s -o /dev/null -w "rekabet.gov.tr -> %{http_code}\n" -A "$UA" "https://www.rekabet.gov.tr/" || echo "exit code: $?"
          echo "-- -k --"
          curl -sk -o /dev/null -w "rekabet.gov.tr -k -> %{http_code}\n" -A "$UA" "https://www.rekabet.gov.tr/" || echo "exit code: $?"
